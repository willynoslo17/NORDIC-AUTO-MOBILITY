<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:image" content="https://motrull.no/og-image.png">
<meta name="twitter:image" content="https://motrull.no/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<title>Siden finnes ikke — Motrull</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#edf1f4;--ink:#182028;--muted:#5a6874;--line:#c8d2da;--accent:#b85a28;--fjord:#2a4550;--on-accent:#fff8f3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Source Sans 3",sans-serif;line-height:1.55;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1.25rem}
main{width:100%;max-width:36rem}
.brand{font-family:"Outfit",sans-serif;font-size:1.5rem;font-weight:800;margin:0;color:var(--ink);text-decoration:none;letter-spacing:.04em}
.rubro{margin:.15rem 0 0;color:var(--muted);font-size:.95rem}
.code{font-family:"Outfit",sans-serif;font-size:clamp(4.5rem,18vw,7rem);line-height:1;font-weight:800;color:var(--accent);margin:2rem 0 .5rem}
h1{font-family:"Outfit",sans-serif;font-weight:700;margin:0 0 .5rem;font-size:1.8rem}
p{margin:0 0 1rem}
.actions{margin-top:1.75rem;display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 1.25rem}
.btn{display:inline-block;background:var(--accent);color:var(--on-accent);text-decoration:none;padding:.8rem 1.4rem;font-weight:700;text-align:center}
.btn:hover,.btn:focus-visible{filter:brightness(1.05)}
.actions a:not(.btn){color:var(--ink);text-underline-offset:3px}
.contact{color:var(--muted);font-size:.95rem}
@media (max-width:480px){.actions{flex-direction:column;align-items:stretch}.btn{width:100%}}
</style>
<meta name="twitter:title" content="Siden finnes ikke — Motrull">
</head>
<body>
<main>
<a class="brand" href="/">Motrull</a>
<p class="rubro">Tilbehør til bil</p>
<div class="code" aria-hidden="true">404</div>
<h1>Siden finnes ikke</h1>
<p>Vi finner ikke denne siden hos Motrull. Den kan være flyttet, eller adressen kan være skrevet feil.</p>
<div class="actions">
<a class="btn" href="/">Til forsiden</a>
<a href="/#shop">Katalogen</a>
<span class="contact">Kontakt: <a href="mailto:kontakt@motrull.no">kontakt@motrull.no</a></span>
</div>
</main>
</body>
</html>
